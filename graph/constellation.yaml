# DMR-Graph — authored knowledge graph of the Mailroom constellation.
#
# Truth source: the PRUNED Digital-Mailroom hub (DMR-079). Node and edge facts
# are read from the hub's origin/main (post-prune) and the v0.8.0 rollback tag,
# and are cross-checked against the constellation's own canonical docs
# (packages/llm-mailroom/docs/constellation/*, README.md, docs/wiki/*) plus the
# READMEs of the standalone repos (Exios66/*, LLM-Mailroom-Services/*) and the
# public Hugging Face API. Facts were verified by four independent research
# passes on 2026-10-16; nothing here is inferred without a source.
#
# Only slugs are recorded (repo / hf_dataset / hf_model / hf_space); the build
# script turns them into links, so no URL is typed twice.
#
# status: active | pending | retired   (retired = dashed, desaturated)

meta:
  title: DMR-Graph
  subtitle: Knowledge graph of the Mailroom constellation
  hub_version: v0.8.0
  prune: DMR-079 consolidation
  packages: 7
  # The page loads with only these nodes visible; everything else is revealed
  # by exploring (double-click a node, click a module, or search).
  seeds: [hub, llm-mailroom, dojo, the-mailroom, local-mailroom-sandbox,
          mailroom-reloaded, mailroom-dataset, eval-environment, mailroom-ml,
          mailroom-issues, corpus-eda, dmr-graph]
  note: >-
    Hub v0.8.0 is the pre-prune rollback point (all ten packages present);
    DMR-079 then pruned llm-entity-extraction, llm-mailroom-graph and
    agent-mailroom, leaving the seven core packages mapped here.
  relations:
    feeds: "data or control flows into the target (stage → stage, dataset → consumer)"
    produces: "the source creates a derived artifact"
    depends: "code or config dependency (version pin, vendored snapshot, import)"
    traces: "runtime telemetry is emitted to an observability sink"
    renders: "the surface displays data coming from the target"
    serves: "the component owns or exposes the target surface / entrypoint"
    governs: "policy, gate or board authority over the target"
    syncs: "mirror, subtree, fork or upload reconciliation"
    deploys: "publishes to a host"
    supersedes: "replaces or retires the target"
    prunes: "removed from the monorepo by DMR-079"
    documents: "coverage edge of this graph"

# Zones are layout columns (left → right) and colour modules.
# Three complementary pairs + one neutral family:
#   amber 36° ↔ indigo 245°   ·   teal 173° ↔ rose 350°   ·   steel 210° ↔ graphite
zones:
  - id: sources
    label: Data & corpora
    blurb: Raw corpora, corpus-feed packages and the pinned Hugging Face datasets.
    fill: "#B87F26"
    border: "#F0C274"
  - id: eval
    label: Evaluation & prompts
    blurb: The one definition of "correct", per-node evals and calibration, the classifier, and the prompt loop.
    fill: "#5A52C7"
    border: "#A9A4F0"
  - id: pipeline
    label: Pipeline & runtime
    blurb: llm-mailroom's 13-node graph, its auxiliary lanes, persistence, the reloaded pipeline and the sandbox.
    fill: "#0F8C7E"
    border: "#69D6C8"
  - id: surfaces
    label: Surfaces
    blurb: What humans look at — console, Observatory, TUI, terminals, boards, graph sites.
    fill: "#C2465A"
    border: "#F39BA8"
  - id: platform
    label: Hub, governance & release
    blurb: The monorepo, its board, its scripts and gates, the issue hub and the release milestones.
    fill: "#3E6E9E"
    border: "#93BCE0"
  - id: external
    label: External platforms
    blurb: Providers, tracing sinks, GPU hosts and storage outside the repos.
    fill: "#5A6473"
    border: "#A9B3C2"

layout:
  # Client-side layout constants (the page packs the *revealed* subgraph:
  # zones are columns sized to their content, so modules never overlap).
  col_step: 268
  y_step: 82
  y0: 40

