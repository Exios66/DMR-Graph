    desc: "Organization fork of the sandbox (SAND-032 Modal + vLLM leg); development continues in the Exios66 original."
  - id: reloaded-vllm
    label: Modal vLLM app (mailroom-vllm)
    zone: pipeline
    kind: service
    status: active
    col: 2
    desc: "OpenAI-compatible Qwen3-8B-AWQ on an L4 with Prometheus metrics — the reloaded pipeline's GPU serving app."
  - id: reloaded-observability
    label: reloaded observability stack
    zone: pipeline
    kind: service
    status: active
    col: 2
    desc: "Docker-compose sidecars: Phoenix :6006, Prometheus :9090, Grafana :3000 (Pipeline / Serving & GPU / Quality dashboards)."
  - id: api
    label: FastAPI producer
    zone: pipeline
    kind: service
    status: active
    col: 2
    desc: "The pipeline's HTTP surface (/v1): upload, run and review endpoints."
  - id: watcher
    label: inbox watcher
    zone: pipeline
    kind: service
    status: active
    col: 2
    desc: "Claims each inbox file exactly once (worker-scoped lock); a stale claim older than WATCHER_STALE_CLAIM_MINUTES is re-queued and the graph re-runs from intake."
  - id: watchdog
    label: watchdog
    zone: pipeline
