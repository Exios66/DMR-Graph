    kind: package
    status: active
    col: 2
    version: "0.3.0"
    repo: Exios66/local-mailroom-sandbox
    desc: "Local-first sandbox: the full graph offline on Ollama / vLLM / llama.cpp / LM Studio, plus Modal GPU studies; tracked vendor/ snapshots."
  - id: mailroom-sandbox
    label: mailroom-sandbox (fork)
    zone: pipeline
