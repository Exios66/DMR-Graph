  - id: intake
    label: intake
    zone: pipeline
    kind: stage
    status: active
    desc: "Ingest specialist — one fused TRIAGE + CLEAN + PREPARE pass over sliding windows."
  - id: classify
    label: classify
    zone: pipeline
    kind: stage
    status: active
    desc: "Sorter agent: one of five document classes plus subclass."
  - id: retry_classify
    label: retry_classify
    zone: pipeline
    kind: stage
    status: active
    desc: "Classification retry arm after a gate miss."
  - id: review_classify
    label: review_classify
    zone: pipeline
    kind: stage
    status: active
    desc: "Lane A second opinion (sorter reviewer) — stays live in production."
  - id: extract
    label: extract
    zone: pipeline
    kind: stage
    status: active
    desc: "Class specialist pulls the class checklist fields."
  - id: retry_extract
    label: retry_extract
    zone: pipeline
    kind: stage
    status: active
    desc: "Extraction retry arm after a gate miss."
  - id: judge_verify
    label: judge_verify
    zone: pipeline
    kind: stage
    status: active
    desc: "Judge-verify: an independent verdict on the extraction."
  - id: arbiter
    label: arbiter
    zone: pipeline
    kind: stage
    status: active
    desc: "Arbitrates conflicts between extraction verdicts."
  - id: human_review
    label: human_review
    zone: pipeline
    kind: stage
    status: active
    desc: "Review queue for low-confidence or disputed documents."
  - id: boss_escalation
    label: boss_escalation
    zone: pipeline
    kind: stage
    status: active
    desc: "Boss escalation — adjudicates the hard conflicts."
  - id: compile_report
    label: compile_report
    zone: pipeline
    kind: stage
    status: active
    desc: "Computational procedural reporter: deterministic matter record, no LLM call."
  - id: catalog_write
    label: catalog_write
    zone: pipeline
    kind: stage
    status: active
    desc: "Writes the matter catalog entry and window stats."
  - id: archive
    label: archive
    zone: pipeline
    kind: stage
    status: active
    desc: "Archives the document with a hash-chained audit entry."
  - id: entry-route
    label: START entry route
    zone: pipeline
    kind: aux
    status: active
    col: 1
    desc: "START router: an approved review-resume re-invocation (resume_extraction + review_decision=approved + doc_type) skips straight to extract; everything else runs intake → classify."
  - id: bert-intake
    label: ModernBERT fast path
    zone: pipeline
    kind: service
    status: active
    col: 1
    desc: "Advisory ingest prior: the ModernBERT classifier composes onto the sorter prompt via intake_prior= (no graph skip). MAILROOM_BERT_INTAKE default off, fail-open."
  - id: gmail-lane
    label: Gmail triage lane
    zone: pipeline
    kind: aux
    status: active
    col: 1
    desc: "Auxiliary flow outside the graph: single-document email intake on a free model, with allowlist + DMARC guards and a durable outbox."
  - id: relations-clerk
    label: relations clerk
    zone: pipeline
    kind: aux
    status: active
    col: 1
    desc: "Post-archive deterministic association scan dispatched at every terminal manifest, with optional LLM judgment (relations.llm, off in pilot)."
  - id: relations-graph
    label: relations graph views
    zone: pipeline
    kind: service
    status: active
    col: 1
    desc: "Ledger projections from the scan: matter graph, global matter graph and document ego-graph (GraphJSON/GraphML, optional Plotly/PNG)."
  - id: pager
    label: operator pager
    zone: pipeline
    kind: service
    status: active
    col: 1
    desc: "SMS pager: ten alert rules, quiet hours, catch-up digests; default off; mailroom.pager/v1 payload."
  - id: provider-health
    label: provider health
    zone: pipeline
    kind: service
    status: active
    col: 1
    desc: "Passive per-provider LLM health (src/llm/provider_health.py, provider_health.json under fcntl flock) that feeds the pager."
  - id: jev-gate
    label: Jev route gate
    zone: pipeline
    kind: aux
    status: pending
    col: 1
    desc: "Opt-in learned route gate (TypeSafe System One): overrides only the medium confidence band once its calibration exists; off by default."
  - id: mailroom-reloaded
    label: mailroom-reloaded (CrewAI Flows)
    zone: pipeline
    kind: package
    status: active
    col: 2
    version: "0.4.2"
    repo: Exios66/mailroom-reloaded
    desc: "Compressed deployment-ready mailroom: ingest → bert_primary → sort → gate_classify → extract → gate_extract → report_catalog_archive (one node), with verify/boss/grade branches off the gates."
  - id: local-mailroom-sandbox
