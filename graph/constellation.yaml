  - id: audit-log
    label: hash-chained audit log
    zone: pipeline
    kind: service
    status: active
    col: 2
    desc: "SQLite hash chain — later tampering is detectable."
  - id: catalog
    label: matter catalog
    zone: pipeline
    kind: service
    status: active
    col: 2
    desc: "Matter records and window stats that the pager and boards read."
  - id: provider-router
    label: provider router
    zone: pipeline
    kind: service
    status: active
    col: 2
    desc: "Routes each call per the agent's taxonomy provider — OpenRouter / Ollama / vLLM (local, Modal, or a LiteLLM gateway) / llamafile / generic — with per-provider cost models."
